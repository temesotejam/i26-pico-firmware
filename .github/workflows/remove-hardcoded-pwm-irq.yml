name: Remove hard-coded PWM IRQ slice

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/remove-hardcoded-pwm-irq.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Remove PWM slice dependency from control loop
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("firmware/i26/control.cpp")
          text = path.read_text(encoding="utf-8")
          old = "  //割り込みフラグリセット\n  pwm_clear_irq(2);\n\n"
          if old not in text:
              raise SystemExit("expected hard-coded pwm_clear_irq(2) block was not found")
          path.write_text(text.replace(old, "", 1), encoding="utf-8")
          PY
          ! grep -n "pwm_clear_irq(2)" firmware/i26/control.cpp
          git diff --check

      - name: Commit change
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/i26/control.cpp
          git commit -m "Remove hard-coded PWM IRQ slice from control loop"
          git push origin HEAD:main
