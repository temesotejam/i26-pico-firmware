name: Bootstrap I-26 firmware source

on:
  push:
    branches:
      - main
    paths:
      - ".bootstrap/parts/**"
      - ".github/workflows/bootstrap.yml"

permissions:
  contents: write
  actions: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Reconstruct and verify I-26 source archive
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE="${RUNNER_TEMP}/i26-source.zip"
          cat .bootstrap/parts/part* | tr -d '\r\n' | base64 --decode > "${ARCHIVE}"
          test "$(stat -c '%s' "${ARCHIVE}")" = "40212"
          echo "2498501864d65987f7df0eb5a0d2253c1c1182cdabb46d5413d873794fee469b  ${ARCHIVE}" | sha256sum --check
          unzip -t "${ARCHIVE}"

      - name: Unpack uploaded I-26 source
        shell: bash
        run: |
          set -euxo pipefail
          ARCHIVE="${RUNNER_TEMP}/i26-source.zip"
          mkdir -p firmware
          unzip -oq "${ARCHIVE}" -d firmware
          test -f firmware/i26/CMakeLists.txt
          test -f firmware/i26/control.cpp
          test -f firmware/i26/lsm9ds1_reg.c

      - name: Verify original source bytes
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          from pathlib import Path

          expected = {
              "pico_copter.cpp": "ad099f7b0b1db9bbd9182f2dfee0589784a27b36",
              "pico_copter.hpp": "d471567c583963cd724e3564b9e786d9fa112b11",
              "control.cpp": "f7144c178ebac92b70cbfed017d4b0e35ed158c6",
              "control.hpp": "389ce23adb362fe6a647afd7953b15c5a853e3bd",
              "ekf.cpp": "b22df1122660823705d863eab9ce70780be8c1d4",
              "ekf.hpp": "1c522f23938e88fcc0c84991b3187472023e3bb7",
              "sensor.cpp": "345b481624e745c2282bac4b1f05f364acc86a8e",
              "sensor.hpp": "811e8932816d62407c22d2b0ee542554fb6ef9d2",
              "pwm.cpp": "97fcbd020c4445f7b319278b6a445da7d9606354",
              "pwm.hpp": "c273de20555b75a34fa98e6861db8e8dfcba40fd",
              "radio.cpp": "19fea84661774c1979c7a4ed6027e3649c364aca",
              "radio.hpp": "23c55e1b4ef6ca3cf0c673e826429b05635e831d",
              "lsm9ds1_reg.c": "93f53e90a340811274cbcbc20bd0cd5a6842dd1d",
              "lsm9ds1_reg.h": "9d92e2e789aa3336b68b14cb44068277fa7c6799",
          }

          root = Path("firmware/i26")
          for name, wanted in expected.items():
              data = (root / name).read_bytes()
              actual = hashlib.sha1(f"blob {len(data)}\0".encode() + data).hexdigest()
              if actual != wanted:
                  raise SystemExit(f"source mismatch: {name}: {actual} != {wanted}")
              print(f"verified {name}: {actual}")
          PY

      - name: Commit portable firmware directory
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/i26
          git commit -m "Add portable I-26 firmware source"
          git push origin HEAD:main

      - name: Start the first Pico build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euxo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/build.yml/dispatches" \
            -f ref=main
